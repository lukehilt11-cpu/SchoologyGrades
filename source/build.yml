# Builds the Windows installer and the Mac disk image on GitHub's computers and
# publishes them on the repository's "Releases" page.
#
# It starts by itself whenever source/VERSION changes (to release a new version,
# edit that one file on the GitHub website), or on demand: Actions tab ->
# "Build and release" -> Run workflow.
name: Build and release

on:
  push:
    branches: [main, master]
    paths:
      - "source/VERSION"
  workflow_dispatch:

permissions:
  contents: write   # lets the last job publish the release

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Inno Setup (makes the installer)
        run: choco install innosetup -y --no-progress

      - name: Tell the program where its releases live (for the update notice)
        shell: bash
        run: echo "${{ github.repository }}" > source/REPO

      - name: Build
        shell: cmd
        working-directory: source
        run: build.bat

      - name: Zip the single-file programs
        shell: pwsh
        run: |
          $v = (Get-Content source/VERSION -TotalCount 1).Trim()
          Compress-Archive -Path SchoologyGrades.exe, SchoologySetup.exe -DestinationPath "releases/SchoologyGrades-$v-exes.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: releases/*
          if-no-files-found: error

  macos:
    name: Mac disk image (Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tell the program where its releases live (for the update notice)
        run: echo "${{ github.repository }}" > source/REPO

      - name: Build
        run: bash source/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: releases/*.dmg
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: built
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          VERSION="$(head -n1 source/VERSION | tr -d '[:space:]')"
          TAG="v$VERSION"

          # Fixed file names, so these links always point at the newest version:
          #   github.com/<owner>/<repo>/releases/latest/download/SchoologyGrades-Setup.exe
          mkdir out
          cp built/SchoologyGrades-*-Setup.exe out/SchoologyGrades-Setup.exe
          cp built/SchoologyGrades-*.dmg out/SchoologyGrades.dmg
          cp built/SchoologyGrades-*-exes.zip out/SchoologyGrades-portable.zip

          cat > notes.md <<'NOTES'
          **Windows:** download **SchoologyGrades-Setup.exe** and run it. If Windows says it "protected your PC", click **More info**, then **Run anyway**. When it finishes, Setup opens so you can choose your classes.

          **Mac (Apple Silicon):** download **SchoologyGrades.dmg**, open it, and drag both apps onto **Applications**. The first time you open each app, macOS blocks it: open **System Settings > Privacy & Security**, scroll down, and click **Open Anyway** next to the app's name.

          **Windows without installing:** **SchoologyGrades-portable.zip** holds the two programs on their own.

          Already installed? Run the new installer over the old one. Your saved login and classes are kept.
          NOTES

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" out/* --title "Schoology Grade Checker $VERSION" --notes-file notes.md --latest --repo "$GITHUB_REPOSITORY"
          fi
