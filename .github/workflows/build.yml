# Builds the Windows installer and the Mac disk image on GitHub's computers and
# publishes them on the repository's "Releases" page.
#
# To release a new version (no Git needed): Actions tab -> "Build and release" ->
# "Run workflow", type the new version number and click the green button. It also starts
# by itself whenever source/VERSION is edited.
# "What's new" is optional: if it is left empty, the release uses the first line of each
# commit made since the last release (so write those lines for students to read).
name: Build and release

on:
  push:
    branches: [main, master]
    paths:
      - "source/VERSION"
  workflow_dispatch:
    inputs:
      version:
        description: "New version number, like 1.3 (leave empty to use the number in source/VERSION)"
        required: false
        type: string
      notes:
        description: "What's new, in a sentence or two. Leave empty to use your commit messages since the last release"
        required: false
        type: string
      test_version:
        description: "Test version: build it, but don't tell students about it"
        required: false
        type: boolean
        default: false

permissions:
  contents: write   # lets the last job publish the release

jobs:
  prepare:
    name: Work out the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        shell: bash
        env:
          TYPED: ${{ inputs.version }}
        run: |
          set -e
          V="$(printf '%s' "$TYPED" | tr -d '[:space:]')"
          if [ -z "$V" ]; then V="$(head -n1 source/VERSION | tr -d '[:space:]')"; fi
          if ! printf '%s' "$V" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "::error::The version must look like 1.3 or 1.3.1 (digits and dots only). It was: $V"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building version $V"

  windows:
    name: Windows installer
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the files were uploaded
        shell: bash
        run: |
          missing=0
          for f in source/build.sh source/build.bat source/grades.pyw source/setup.py source/autopilot.py source/sgcommon.py \
                   source/grades.spec source/make_icons.py source/installer.iss source/dmg_settings.py source/VERSION; do
            if [ ! -f "$f" ]; then echo "::error::Missing from the repository: $f"; missing=1; fi
          done
          # Signs that a file in the repository is an old version:
          grep -q "dmgbuild" source/build.sh      || { echo "::error::source/build.sh in the repository is an old version. Upload the newest one."; missing=1; }
          grep -q "defined CI" source/build.bat   || { echo "::error::source/build.bat in the repository is an old version. Upload the newest one."; missing=1; }
          grep -q "ensure_icons" source/grades.spec || { echo "::error::source/grades.spec in the repository is an old version. Upload the newest one."; missing=1; }
          grep -q "offer_update" source/sgcommon.py || { echo "::error::source/sgcommon.py in the repository is an old version. Upload the newest one."; missing=1; }
          echo "Files in source/:"; ls -la source
          exit $missing

      - name: Use this version number
        shell: bash
        env:
          V: ${{ needs.prepare.outputs.version }}
        run: printf '%s\n' "$V" > source/VERSION

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draw the icons (the build also does this if they are missing)
        shell: bash
        run: |
          python -m pip install --quiet pillow numpy
          python source/make_icons.py
          ls -la source/icons

      - name: Install Inno Setup (makes the installer)
        run: choco install innosetup -y --no-progress

      - name: Tell the program where its releases live (for the update notice)
        shell: bash
        run: echo "${{ github.repository }}" > source/REPO

      - name: Build
        shell: cmd
        working-directory: source
        run: build.bat

      - name: Zip the single-file programs
        shell: pwsh
        run: |
          $v = (Get-Content source/VERSION -TotalCount 1).Trim()
          Compress-Archive -Path SchoologyGrades.exe, SchoologySetup.exe, SchoologyAutopilot.exe -DestinationPath "releases/SchoologyGrades-$v-exes.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: releases/*
          if-no-files-found: error

  macos:
    name: Mac disk image (Apple Silicon)
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the files were uploaded
        shell: bash
        run: |
          missing=0
          for f in source/build.sh source/build.bat source/grades.pyw source/setup.py source/autopilot.py source/sgcommon.py \
                   source/grades.spec source/make_icons.py source/installer.iss source/dmg_settings.py source/VERSION; do
            if [ ! -f "$f" ]; then echo "::error::Missing from the repository: $f"; missing=1; fi
          done
          grep -q "dmgbuild" source/build.sh      || { echo "::error::source/build.sh in the repository is an old version. Upload the newest one."; missing=1; }
          grep -q "ensure_icons" source/grades.spec || { echo "::error::source/grades.spec in the repository is an old version. Upload the newest one."; missing=1; }
          grep -q "offer_update" source/sgcommon.py || { echo "::error::source/sgcommon.py in the repository is an old version. Upload the newest one."; missing=1; }
          echo "Files in source/:"; ls -la source
          exit $missing

      - name: Use this version number
        shell: bash
        env:
          V: ${{ needs.prepare.outputs.version }}
        run: printf '%s\n' "$V" > source/VERSION

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Draw the icons (the build also does this if they are missing)
        shell: bash
        run: |
          python -m pip install --quiet pillow numpy
          python source/make_icons.py
          ls -la source/icons

      - name: Tell the program where its releases live (for the update notice)
        run: echo "${{ github.repository }}" > source/REPO

      - name: Build
        run: bash source/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: releases/*.dmg
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [prepare, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: built
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          NOTES: ${{ inputs.notes }}
          TEST: ${{ inputs.test_version }}
        run: |
          set -e

          # No notes typed? Use the first line of each commit since the previous release.
          : > commits.txt
          PREV=$(git tag --list 'v*' --sort=-v:refname | grep -v -- '-test$' | grep -vx "v$VERSION" | head -1 || true)
          git log ${PREV:+$PREV..HEAD} --no-merges --pretty=%s \
            | grep -v -E '^(Version [0-9]|Merge |Revert )' | head -8 > commits.txt || true

          # Fixed file names, so these links always point at the newest version:
          #   github.com/<owner>/<repo>/releases/latest/download/SchoologyGrades-Setup.exe
          mkdir out
          cp built/SchoologyGrades-*-Setup.exe out/SchoologyGrades-Setup.exe
          cp built/SchoologyGrades-*.dmg out/SchoologyGrades.dmg
          cp built/SchoologyGrades-*-exes.zip out/SchoologyGrades-portable.zip

          # latest.json: what's new plus a checksum for every download. The program reads it
          # to show what's new and to check a download before it installs it.
          python3 - <<'PY'
          import datetime, hashlib, json, os

          files = {}
          for name in sorted(os.listdir("out")):
              digest, size = hashlib.sha256(), 0
              with open(os.path.join("out", name), "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      digest.update(chunk)
                      size += len(chunk)
              files[name] = {"sha256": digest.hexdigest(), "size": size}

          version = os.environ["VERSION"]
          notes = " ".join(os.environ.get("NOTES", "").split())
          auto = []
          if not notes and os.path.exists("commits.txt"):
              with open("commits.txt", encoding="utf-8") as f:
                  auto = [" ".join(line.split()).rstrip(".") for line in f if line.strip()]
              short = ""
              for line in auto:  # the update prompt shows about 600 characters: stop before it overflows
                  if len(short) + len(line) > 560:
                      break
                  short += ("; " if short else "") + line
              notes = short
          with open("out/latest.json", "w", encoding="utf-8") as f:
              json.dump({"version": version, "notes": notes, "date": datetime.date.today().isoformat(), "files": files}, f, indent=2)

          body = ""
          if os.environ.get("TEST") == "true":
              body += "**Test version:** students are not told about this one.\n\n"
          if auto:
              body += "**What's new:**\n" + "".join("- " + line + "\n" for line in auto) + "\n"
          elif notes:
              body += "**What's new:** " + notes + "\n\n"
          body += """**Windows:** download **SchoologyGrades-Setup.exe** and run it. If Windows says it "protected your PC", click **More info**, then **Run anyway**. When it finishes, Setup opens so you can choose your classes.

          **Mac (Apple Silicon):** download **SchoologyGrades.dmg**, open it, and drag all three apps onto **Applications**. The first time you open each app, macOS blocks it: open **System Settings > Privacy & Security**, scroll down, and click **Open Anyway** next to the app's name.

          **Windows without installing:** **SchoologyGrades-portable.zip** holds the three programs (Grades, Setup and Autopilot) on their own.

          Already installed? The program offers to update itself (Help > Check for updates), or run the new installer over the old one. Your saved login and classes are kept.
          """
          with open("notes.md", "w", encoding="utf-8") as f:
              f.write(body.replace("\n          ", "\n"))
          PY

          TAG="v$VERSION"; TITLE="Schoology Grade Checker $VERSION"; FLAGS="--latest"
          if [ "$TEST" = "true" ]; then TAG="v$VERSION-test"; TITLE="$TITLE (test)"; FLAGS="--prerelease"; fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" out/* --title "$TITLE" --notes-file notes.md $FLAGS --repo "$GITHUB_REPOSITORY"
          fi

      - name: Remember the version number in the repository
        if: ${{ inputs.version != '' && inputs.test_version != true }}
        env:
          V: ${{ needs.prepare.outputs.version }}
        run: |
          printf '%s\n' "$V" > source/VERSION
          if ! git diff --quiet -- source/VERSION; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add source/VERSION
            git commit -m "Version $V"
            git push
          fi
  website:
    name: Update the website
    needs: [prepare, release]
    if: ${{ inputs.test_version != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect the site files
        run: |
          mkdir _site
          cp index.html _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4